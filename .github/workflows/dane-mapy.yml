# Miesieczna budowa danych mapy ileZaPokoj: adresy PRG + grafy drog OSM, bramki jakosci, wydanie jako GitHub Release.
# Serwer sam pobiera najnowsze wydanie (model "pull") - workflow nie ma zadnego klucza do serwera. Czerwona bramka = brak wydania, serwer i uzytkownicy zostaja na poprzednich danych.
name: dane-mapy

on:
  schedule:
    # 8. dnia miesiaca: plik miesieczny Geofabrik z 1. dnia juz jest. Minuta inna niz :00, bo o pelnych godzinach
    # GitHub przy obciazeniu porzuca runy; drugi termin 11. dnia dziala tylko, gdy ten miesiac nie ma jeszcze wydania.
    - cron: "17 3 8 * *"
    - cron: "17 3 11 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dane-mapy
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.done.outputs.skip }}
    steps:
      - id: done
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          month=$(date -u +%Y%m)
          tags=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 20 --json tagName -q '.[].tagName')
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] && echo "$tags" | grep -q "^dane-${month}"; then
            echo "Wydanie z ${month} juz jest - pomijam."
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.skip != '1'
    # ARM, bo runnery x64 bywaja w sieci Amazona, ktorej czesc Geofabrik odrzuca (3.42.157.0/24: 1 z 40 runnerow, 2 z 9
    # naszych przebiegow, pomiar 2026-11-25); ARM sa tylko w Azure, 22 z 22 polaczone.
    runs-on: ubuntu-24.04-arm
    # Grafy wszystkich powiatow i ich bramki; czas przebiegu 2026-11-24 w README.
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Miejsce na dysku
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /
      - name: Zaleznosci Python
        run: python -m pip install --target pylib -r pipeline/requirements.txt
      - name: Prywatne fixture bramek
        env:
          PRIVATE_FIXTURES: ${{ secrets.PRIVATE_FIXTURES }}
        run: node pipeline/private_fixtures.mjs
      # Odniesieniem bramek delta sa liczniki poprzedniego wydania; pierwsze wydanie bierze fixtures/prev_counts_gml.json.
      - name: Liczniki poprzedniego wydania
        run: |
          if gh release download --repo "$GITHUB_REPOSITORY" --pattern counts.json --dir prev; then
            echo "PREV_ARG=--prev=prev/counts.json" >> "$GITHUB_ENV"
          fi
      - name: Budowa z bramkami
        run: node pipeline/run_pipeline.mjs --pylib=pylib --publish=out $PREV_ARG
      - name: Alarmy bramek
        run: grep -h ALARM build/run-*/logs/gates.log | sed 's/^/::warning title=Bramka::/' || true
      - name: Falsyfikacja bramek grafu
        if: github.ref_name != 'main'
        run: node pipeline/falsify_graph.mjs build/run-* out/current/counts.json falsify-tmp
      # Wydanie tylko z main: przebieg reczny z innej galezi to proba (raporty i grafy w artefakcie), serwer jej nie zobaczy.
      - name: Wydanie
        if: github.ref_name == 'main'
        run: |
          dir=$(date -u +%Y%m%d-%H%M%S)
          mkdir -p release
          cp -r out/current "release/$dir"
          tar -cf "dane-$dir.tar" -C release "$dir"
          sha256sum "dane-$dir.tar" > "dane-$dir.tar.sha256"
          cp out/current/counts.json counts.json
          snapshot=$(node -p "require('./out/current/manifest.json').snapshot")
          gh release create "dane-$dir" "dane-$dir.tar" "dane-$dir.tar.sha256" counts.json \
            --title "Dane mapy $dir" \
            --notes "Zrodla: $snapshot. Adresy: PRG (GUGiK, CC BY 4.0). Grafy drog: (c) OpenStreetMap contributors, ODbL 1.0."
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raporty-${{ github.run_id }}
          path: |
            build/run-*/run_status.json
            build/run-*/gates_report.json
            build/run-*/logs/
            build/run-*/graph/graph_stats.json
            build/run-*/osm/osm_extract_stats.json
          retention-days: 35
      - name: Grafy z proby
        if: github.ref_name != 'main'
        uses: actions/upload-artifact@v4
        with:
          name: grafy-${{ github.run_id }}
          path: |
            out/current/graph-*.gz
            out/current/manifest.json
          retention-days: 7
      # Wzorzec tras to alarm w podsumowaniu. Na koncu, zeby brak czasu, dysku albo pamieci nie zabral wydania ani raportow.
      - name: Wzorzec tras (OSRM)
        continue-on-error: true
        timeout-minutes: 60
        shell: bash
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
          work=$(ls -d build/run-*)
          node pipeline/osrm_reference.mjs out/current "$work/osm/areas.json" dl/poland.osm.pbf osrm-tmp osrm_reference.json | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: osrm-${{ github.run_id }}
          path: osrm_reference.json
          if-no-files-found: ignore
          retention-days: 35
